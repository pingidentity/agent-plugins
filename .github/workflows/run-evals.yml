name: Run Evals

on:
  push:
    branches: [main]
    paths:
      - "plugins/ping-identity/skills/**"
      - "evals/**"
      - "scripts/**"
  pull_request:
    paths:
      - "plugins/ping-identity/skills/**"
      - "evals/**"
      - "scripts/**"
  workflow_dispatch:
    inputs:
      live_eval:
        description: "Run live Claude adapter (Bedrock) — costs API credits"
        type: boolean
        default: false

jobs:
  validate-prompts:
    name: Validate prompt YAML files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml jsonschema --quiet

      - name: Validate prompt sets
        run: python3 -m evals.harness.validate_prompts

  mock-eval-layer1:
    name: Layer 1 routing eval (mock)
    runs-on: ubuntu-latest
    needs: validate-prompts

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml --quiet

      - name: Run Layer 1 mock eval
        run: python3 -m evals.harness.run_eval --adapter mock --layer 1

  mock-eval-layer2:
    name: Layer 2 anchor selection eval (mock)
    runs-on: ubuntu-latest
    needs: validate-prompts

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml --quiet

      - name: Run Layer 2 mock eval
        run: python3 -m evals.harness.run_eval --adapter mock --layer 2

  live-eval-layer1:
    name: Layer 1 routing eval (live Bedrock)
    runs-on: ubuntu-latest
    needs: [mock-eval-layer1, mock-eval-layer2]
    # Only run on main push or when manually triggered with live_eval=true
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.live_eval == true)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml anthropic --quiet

      - name: Run Layer 1 live eval
        env:
          CLAUDE_CODE_USE_BEDROCK: "1"
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'eu-west-2' }}
        run: python3 -m evals.harness.run_eval --adapter claude --layer 1 --write-results

      - name: Upload eval results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results-${{ github.run_id }}
          path: evals/results/
          retention-days: 30
