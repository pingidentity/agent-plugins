name: Validate Skills

on:
  push:
    branches: [main]
    paths:
      - "plugins/ping-identity/skills/**"
      - "plugins/ping-identity/references/index.json"
      - "shared/schemas/**"
      - "scripts/validate_skills.py"
  pull_request:
    paths:
      - "plugins/ping-identity/skills/**"
      - "plugins/ping-identity/references/index.json"
      - "shared/schemas/**"
      - "scripts/validate_skills.py"
  workflow_dispatch:

jobs:
  validate-content:
    name: Validate skill content
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run skill validator
        run: python3 scripts/validate_skills.py --root .

  check-links:
    name: Check markdown links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: lychee-

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --cache
            --max-cache-age 7d
            --exclude-mail
            --exclude "localhost"
            --exclude "127\\.0\\.0\\.1"
            --exclude "developer\\.pingidentity\\.com/orchsdks"
            --exclude "docs\\.pingidentity\\.com"
            --exclude "auth\\.pingone\\.com"
            --exclude "apps\\.pingone\\.com"
            --exclude "admin\\.pingone\\.com"
            --exclude "console\\.pingone\\.com"
            --exclude "davinci\\.pingidentity\\.com"
            --exclude "forgeblocks\\.com"
            --exclude "github\\.com/pingidentity"
            --include "https://.*"
            "plugins/ping-identity/skills/**/*.md"
          fail: false
          jobSummary: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
