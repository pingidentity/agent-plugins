id: 03-credentials-issuance-davinci
skill: ping-universal-services
title: "PingOne Credentials: verifiable credential issuance via DaVinci connector"

prompt: |
  Set up PingOne Credentials issuance inside a DaVinci flow that runs after a
  successful PingOne Verify identity proofing step.

  Requirements:

  1. Identify the correct DaVinci connector name used to issue verifiable
     credentials (PingOne Credentials connector — not a generic HTTP connector).
  2. Describe the two required inputs the connector needs from the preceding
     Verify step: the PingOne user ID and the verified identity data.
  3. Explain that the credential type and issuance policy must be pre-configured
     in PingOne Credentials before the DaVinci flow references them.
  4. Describe what the connector returns: a wallet deep-link or QR code that the
     user scans to accept the credential into their digital wallet.
  5. Wire the flow to handle the case where the user does not have a compatible
     wallet installed — branch to an enrollment or download step rather than
     silently failing.

  Write a DaVinci flow design document (Markdown) covering connector placement,
  required configuration fields, input/output bindings, and the wallet-absent
  branch.

expected_artifacts:
  - "**/*.md"
  - "**/*.txt"

deterministic_checks:
  - id: credentials-connector-name
    description: "Names the PingOne Credentials connector (not a generic HTTP connector)"
    type: grep
    glob: "**/*"
    pattern: "PingOne Credentials"
    must_match: true

  - id: credential-type-prereq
    description: "States that credential type must be pre-configured before the flow references it"
    type: grep
    glob: "**/*"
    pattern: "credential type"
    must_match: true

  - id: wallet-deeplink-or-qr
    description: "Connector output is a wallet deep-link or QR code for the user to accept"
    type: regex
    glob: "**/*"
    pattern: "(?i)(deep.?link|qr)"
    must_match: true

  - id: wallet-absent-branch
    description: "Flow branches to handle users without a compatible wallet"
    type: regex
    glob: "**/*"
    pattern: "(?i)(wallet.*absent|no.*wallet|without.*wallet|wallet.*not.*installed|download|enroll)"
    must_match: true

  - id: issuance-policy-prereq
    description: "Mentions issuance policy as a prerequisite configuration item"
    type: grep
    glob: "**/*"
    pattern: "issuance policy"
    must_match: true

  - id: no-generic-http-connector
    description: "Does NOT replace the PingOne Credentials connector with a generic HTTP REST call"
    type: not_contains
    glob: "**/*"
    pattern: "Generic HTTP"

judge_rubric:
  enabled: false
