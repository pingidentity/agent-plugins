id: 05-mobile-app-login-entry-point
skill: ping-quickstart
title: "Adding login to a mobile app — where to start with Ping?"

prompt: |
  I want to add login and registration to my mobile app using Ping Identity.
  The app has both an Android version (Kotlin/Jetpack Compose) and an iOS
  version (Swift/SwiftUI). We have not set up any Ping platform yet.
  Where do I start and which SDK should I use?

expected_artifacts:
  - "**/*.md"
  - "**/*.txt"

deterministic_checks:
  - id: mentions-sdk
    description: "Response mentions SDK"
    type: grep
    glob: "**/*.md"
    pattern: "SDK"
    must_match: true

  - id: mentions-android-or-ios-platform
    description: "Response mentions at least one of Android, iOS, Swift, or Kotlin"
    type: regex
    glob: "**/*.md"
    pattern: "Android|iOS|Swift|Kotlin"
    must_match: true

judge_rubric:
  enabled: true
  criteria:
    - name: correctness
      description: "Recommendations are factually accurate for Ping Identity products"
      weight: 0.5
    - name: completeness
      description: "Covers the key decision points a developer needs"
      weight: 0.5
  pass_threshold: 0.7
  judge_model: gpt-5.5
