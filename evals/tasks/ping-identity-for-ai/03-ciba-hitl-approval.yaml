id: 03-ciba-hitl-approval
skill: ping-identity-for-ai
title: "Implement CIBA human-in-the-loop approval for a high-risk AI agent action"

prompt: |
  My AI agent workflow needs to pause before executing a high-risk action
  (e.g. initiating a large financial transfer) and request explicit approval
  from a human approver — without requiring that human to be present in the
  original session. Implement CIBA (Client-Initiated Backchannel Authentication)
  using PingFederate to achieve this. Produce Python code that:
  1. POSTs a backchannel authentication request to the CIBA endpoint.
  2. Extracts the auth_req_id from the response.
  3. Polls the token endpoint until the human approves (or the request times out).
  4. Uses the returned id_token as proof of human approval before proceeding.

expected_artifacts:
  - "**/*.py"
  - "**/*.ts"
  - "**/*.js"

deterministic_checks:
  - id: backchannel-endpoint
    description: "Code targets the backchannel authentication endpoint"
    type: regex
    glob: "**/*.py"
    pattern: "backchannel|bc.authorize|bc_authorize"
    flags: "i"
    must_match: true

  - id: ciba-term
    description: "Code or comments reference CIBA by name"
    type: regex
    glob: "**/*.py"
    pattern: "ciba|CIBA"
    must_match: true

  - id: auth-req-id
    description: "Code extracts the auth_req_id field from the CIBA response"
    type: grep
    glob: "**/*.py"
    pattern: "auth_req_id"
    must_match: true

  - id: polling-loop
    description: "Code implements a polling loop to wait for the token response"
    type: regex
    glob: "**/*.py"
    pattern: "while|poll|sleep|pending|authorization_pending"
    flags: "i"
    must_match: true

judge_rubric:
  enabled: false
