non_trigger_prompts:
  - id: N-01
    prompt: "Build me a registration journey in PingOne ST that collects email and sends an OTP."
    expected_skill: ping-orchestration
    notes: "Platform and task named explicitly — route to orchestration."

  - id: N-02
    prompt: "Add an OIDC application to my AIC tenant."
    expected_skill: ping-foundation
    notes: "Specific admin task on a named platform."

  - id: N-03
    prompt: "Integrate the Ping iOS SDK with our AIC journeys."
    expected_skill: ping-app-integration

  - id: N-04
    prompt: "Score risk with PingOne Protect during my login flow and adapt the journey."
    expected_skill: ping-orchestration
    notes: "Specific orchestration + services task — not an orientation question."

  - id: N-05
    prompt: "Give my AI agent a verified identity for API access using Ping."
    expected_skill: ping-identity-for-ai

ambiguous_prompts:
