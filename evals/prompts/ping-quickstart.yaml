    prompt: "I want to add MFA."
    expected_clarification_keywords: ["pingone", "aic", "platform", "workforce", "ciam", "mt", "st"]

  - id: A-02
    prompt: "How do I do passwordless?"
    expected_clarification_keywords: ["pingone", "aic", "platform", "product", "davinci", "journey"]

  - id: A-03
    prompt: "We need risk-based authentication."
    expected_clarification_keywords: ["pingone", "aic", "platform", "protect", "davinci", "journey"]

  - id: A-04
    prompt: "Add a user to Ping."
    expected_clarification_keywords: ["pingone", "aic", "pingfederate", "platform", "mt", "st", "directory", "product"]
    notes: "Bare command with no platform — Ping has many products with user populations; must clarify before routing."
